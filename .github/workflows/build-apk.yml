name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # нужно для создания GitHub Release с прикреплённым APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # Генерируем чистый Android-скаффолд прямо тут, на раннере GitHub —
      # так Gradle-файлы (build.gradle, settings.gradle, gradle-wrapper)
      # всегда соответствуют версии Flutter, которая реально ставится
      # этим шагом, а не версии, под которую я писал этот workflow заранее.
      #
      # org=com.carlauncher + project-name=app => applicationId/package
      # com.carlauncher.app — это ровно тот пакет, под который написаны
      # файлы в android_overlay/kotlin/com/carlauncher/app/.
      - name: Generate base Flutter project
        run: flutter create --platforms android --org com.carlauncher --project-name app build_output

      - name: Overlay custom Dart source (lib/)
        run: |
          rm -rf build_output/lib
          cp -r lib build_output/lib
          # Шаблонный тест flutter create ссылается на класс MyApp из
          # шаблонного lib/, которого у нас нет — он ломает analyze.
          rm -rf build_output/test

      - name: Overlay custom Android source
        run: |
          mkdir -p build_output/android/app/src/main/kotlin/com/carlauncher/app
          cp android_overlay/kotlin/com/carlauncher/app/*.kt \
             build_output/android/app/src/main/kotlin/com/carlauncher/app/
          cp android_overlay/AndroidManifest.xml \
             build_output/android/app/src/main/AndroidManifest.xml
          mkdir -p build_output/android/app/src/main/res/xml
          cp android_overlay/res/xml/device_admin_receiver.xml \
             build_output/android/app/src/main/res/xml/device_admin_receiver.xml

      - name: Patch pubspec.yaml and Gradle dependencies
        run: python3 scripts/patch_project.py build_output

      - name: flutter pub get
        working-directory: build_output
        run: flutter pub get

      # Ошибки компиляции Dart ловим заранее и понятнее, чем в выводе Gradle.
      # Предупреждения/подсказки линтера сборку не валят — только ошибки.
      - name: flutter analyze
        working-directory: build_output
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$GITHUB_WORKSPACE/analyze.log"

      - name: Build release APK
        working-directory: build_output
        shell: bash
        run: flutter build apk --release 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Переподписываем APK публичным платформенным ключом AOSP. На
      # прошивках, которые доверяют этому ключу (многие китайские
      # магнитолы — у пользователя так запускается CarCar),
      # sharedUserId=android.uid.system делает лаунчер системным
      # приложением, и только тогда работает встраивание живых окон
      # (ActivityView). Ключ публичный — лежит в открытом AOSP;
      # приватности он не несёт, это тестовый ключ сборки Android.
      - name: Platform-sign APK with AOSP test key
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/signing"
          cd "$GITHUB_WORKSPACE/signing"
          base="https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security"
          curl -fsSL "$base/platform.pk8" -o platform.pk8
          curl -fsSL "$base/platform.x509.pem" -o platform.x509.pem

          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          APKSIGNER="$BT/apksigner"
          ZIPALIGN="$BT/zipalign"

          IN="$GITHUB_WORKSPACE/build_output/build/app/outputs/flutter-apk/app-release.apk"
          OUT="$GITHUB_WORKSPACE/car-launcher-signed.apk"

          "$ZIPALIGN" -f -p 4 "$IN" "$OUT"
          "$APKSIGNER" sign \
            --key platform.pk8 --cert platform.x509.pem \
            --v2-signing-enabled true --v3-signing-enabled true \
            "$OUT"
          echo "=== signer certificate (ожидается AOSP platform, SHA1 2719...) ==="
          "$APKSIGNER" verify --print-certs "$OUT" | grep -i "SHA-1" || true

      # Полные логи Actions отдаются с домена, который доступен не из
      # всех окружений; аннотации запуска видны через обычный GitHub API.
      # Поэтому при падении дублируем ключевые строки ошибок в аннотацию.
      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'EOF'
          import pathlib
          for name in ("analyze.log", "build.log"):
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              lines = p.read_text(errors="replace").splitlines()
              errors = [l for l in lines if "error" in l.lower() or l.startswith("e: ")]
              chosen = errors[:40] or lines[-40:]
              msg = "\n".join(chosen).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={name}::{msg}")
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: car-launcher-signed.apk
          if-no-files-found: error

      # Артефакты Actions (шаг выше) отдаются через blob.core.windows.net,
      # который недоступен из некоторых сетевых окружений. Релиз с
      # прикреплённым файлом отдаётся через github.com — проще скачать
      # откуда угодно, включая автоматизацию без доступа к тому домену.
      - name: Publish as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          cp "$GITHUB_WORKSPACE/car-launcher-signed.apk" "car-launcher-${tag}.apk"
          gh release create "$tag" "car-launcher-${tag}.apk" \
            --repo "${{ github.repository }}" \
            --title "Car Launcher build #${{ github.run_number }}" \
            --notes "Автоматическая сборка из коммита ${{ github.sha }}. Подписан платформенным ключом AOSP (системное приложение)."
